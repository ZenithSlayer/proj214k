openapi: 3.1.0
info:
  title: 214K Commerce API
  version: 1.0.0
  description: |
    Public API gateway for the 214K Expo application. Protected endpoints require
    a JWT in the Authorization header. Users, Catalog, Cart, and Orders are
    separate services with independently owned MySQL databases. Redis is used
    only for catalog cache and best-effort signed Pub/Sub events.
servers:
  - url: http://localhost:8080
    description: Local Nginx API gateway
tags:
  - name: Catalog
  - name: Categories
  - name: Accounts
  - name: Cart
  - name: Orders
paths:
  /:
    get:
      summary: API liveness response
      responses:
        "200":
          description: API is responding
          content:
            text/html:
              schema:
                type: string
  /health/ready:
    get:
      summary: Readiness check for the Users service and its database
      responses:
        "200":
          description: API and database are ready
        "503":
          description: Database is unavailable
  /products:
    get:
      tags: [Catalog]
      summary: List active products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags: [Catalog]
      summary: Create a product
      description: Requires an authenticated administrator.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
        "401":
          $ref: "#/components/responses/Unauthorized"
  /products/tag:
    get:
      tags: [Catalog]
      summary: List categories used by active products
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products/tag/{id}:
    get:
      tags: [Catalog]
      summary: List active products in a category
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product list for the category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      tags: [Catalog]
      summary: Get an active product
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    put:
      tags: [Catalog]
      summary: Update a product
      description: Requires an authenticated administrator.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Catalog]
      summary: Soft-delete a product
      description: Requires an authenticated administrator.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product archived
        "401":
          $ref: "#/components/responses/Unauthorized"
  /products/upload-image:
    post:
      tags: [Catalog]
      summary: Upload and deduplicate a product image
      description: Requires an authenticated administrator.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPG, PNG, or WebP; maximum 10 MiB.
      responses:
        "201":
          description: Image saved
        "200":
          description: Duplicate image reused
        "400":
          description: Invalid or unsupported image
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      tags: [Categories]
      summary: List active categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      tags: [Categories]
      summary: Create a category
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Category created
        "409":
          description: Category already exists
  /users/register:
    post:
      tags: [Accounts]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, cpf]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                cpf: { type: string, minLength: 11, maxLength: 11 }
      responses:
        "201":
          description: Account created and token issued
        "400":
          description: Required fields missing
        "409":
          description: Email or CPF already exists
  /users/login:
    post:
      tags: [Accounts]
      summary: Log in with email or name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: JWT and user profile
        "401":
          description: Invalid credentials
  /users/me:
    get:
      tags: [Accounts]
      summary: Get the authenticated user's profile and related data
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User profile, addresses, and payment-card metadata; order history is available from GET /orders
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/profile:
    put:
      tags: [Accounts]
      summary: Update profile name and email
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: Profile updated
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/password:
    put:
      tags: [Accounts]
      summary: Change the authenticated user's password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "200":
          description: Password updated
        "400":
          description: Current password is incorrect
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/address:
    post:
      tags: [Accounts]
      summary: Add a shipping address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, state, city, street, number]
              properties:
                country: { type: string }
                state: { type: string }
                city: { type: string }
                street: { type: string }
                number: { type: string }
                postal_code: { type: string }
      responses:
        "200":
          description: Address added
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/address/{id}:
    put:
      tags: [Accounts]
      summary: Update an address
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country: { type: string }
                state: { type: string }
                city: { type: string }
                street: { type: string }
                number: { type: string }
                postal_code: { type: string }
      responses:
        "200":
          description: Address updated
    delete:
      tags: [Accounts]
      summary: Delete an address
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Address deleted
  /users/address/{id}/favorite:
    put:
      tags: [Accounts]
      summary: Set an address as the favorite
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Favorite address updated
  /users/card:
    post:
      tags: [Accounts]
      summary: Add payment-card metadata
      description: |
        Existing implementation stores card fields directly and is not suitable
        for production payment processing. Use a PCI-compliant payment provider
        and tokens instead; never send or log real payment details to this demo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_number, security_code, expiration_date]
              properties:
                card_number: { type: string }
                security_code: { type: string }
                expiration_date: { type: string, format: date }
      responses:
        "200":
          description: Payment-card metadata added
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/card/{id}:
    delete:
      tags: [Accounts]
      summary: Delete a payment-card record
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payment-card record deleted
  /users/card/{id}/favorite:
    put:
      tags: [Accounts]
      summary: Set a payment-card record as the favorite
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Favorite payment-card record updated
  /users:
    delete:
      tags: [Accounts]
      summary: Delete the authenticated account
      description: Deletes the account's profile, addresses, cards, cart, and orders across their owning services.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: A dependent service could not remove its account data
  /cart:
    get:
      tags: [Cart]
      summary: Get the authenticated user's cart
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cart items
    post:
      tags: [Cart]
      summary: Add a product to the cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: integer }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Cart updated
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Cart]
      summary: Clear the authenticated user's cart
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Cart cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
  /cart/{id}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Quantity updated
    delete:
      tags: [Cart]
      summary: Remove a cart item
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Item removed
  /orders:
    get:
      tags: [Orders]
      summary: Get the authenticated user's order history
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Order history
    post:
      tags: [Orders]
      summary: Place an order
      description: |
        Requires an existing address, payment-method record, and non-empty cart.
        The Orders service reads current prices from Catalog, calculates the
        total server-side, and atomically stores the order and line items in its
        own database. The cart is cleared after the order transaction commits.
        No payment provider is integrated; the new order remains pending.
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Order created
        "400":
          description: Address/payment method is missing or cart is empty
        "502":
          description: A dependent service is unavailable
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order line items
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Order items
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Missing or invalid JWT
  schemas:
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        image_url: { type: [string, "null"] }
        category_id: { type: [integer, "null"] }
        category_name: { type: [string, "null"] }
    ProductInput:
      type: object
      required: [name, description, price]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        image_url: { type: [string, "null"], format: uri }
        category_id: { type: integer }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
