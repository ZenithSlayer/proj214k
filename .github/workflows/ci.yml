name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the main branch to the configured production host
        type: choice
        options: ["no", "yes"]
        default: "no"
        required: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build Expo web app
        run: npx expo export --platform web
      - run: npm run lint

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: projeto22026
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .backend/package-lock.json
      - run: npm ci
        working-directory: .backend
      - name: Initialize test schema
        run: mysql -h127.0.0.1 -uroot -proot < .backend/Script.sql
      - name: Run backend tests
        run: npm test
        working-directory: .backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: projeto22026
          JWT_SECRET: ci-test-jwt-secret

  build:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build API image
        run: docker build -t proj214k-api:${{ github.sha }} .backend

  deploy:
    runs-on: ubuntu-latest
    needs: [frontend, backend, build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust deployment host
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Update Compose deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/proj214k && git pull --ff-only origin main && docker compose --env-file .env up -d --build --remove-orphans && docker compose ps && curl -fsS http://127.0.0.1:8080/health/ready >/dev/null && curl -fsS http://127.0.0.1:8080/products >/dev/null'
